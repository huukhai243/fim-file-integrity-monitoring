# Cấu hình mặc định của FIM.
# Mọi đường dẫn tương đối được tính từ thư mục gốc project, không phải thư mục hiện hành.

storage:
  db_path: data/fim.db
  retention_days: 90        # 0 = giữ vĩnh viễn

# ---------------------------------------------------------------------------
# Người 1 — baseline hash và theo dõi thay đổi
# ---------------------------------------------------------------------------
baseline:
  algo: blake2b             # blake2b (nhanh) | sha256 | sha1 | md5
  digest_size: 32           # byte, chỉ áp dụng cho blake2b
  chunk_size: 1048576       # đọc theo khối 1 MiB
  max_file_size: 536870912  # >512 MiB thì chỉ theo dõi metadata, không băm
  follow_symlinks: false    # ĐỪNG bật: cần phát hiện chính symlink bị đổi đích
  workers: 4                # số luồng băm song song

watch:
  mode: auto                # auto | realtime (inotify) | polling
  poll_interval: 5m         # chu kỳ quét khi chạy polling
  debounce: 1.5s            # gộp sự kiện trùng trên cùng file
  rescan_after: 1h          # realtime vẫn quét đủ định kỳ, phòng sự kiện bị rơi
  queue_size: 10000

# ---------------------------------------------------------------------------
# Người 3 — phạm vi giám sát
# ---------------------------------------------------------------------------
scope:
  profile: auto             # auto | linux-system | windows-system | custom
  include: []               # bổ sung thêm vào hồ sơ, ví dụ: ["/opt/myapp"]
  exclude: []               # loại trừ thêm, ví dụ: ["/opt/myapp/logs/**"]
  critical: []              # coi là trọng yếu (Người 2 chấm điểm nặng hơn)
  max_depth: 64
  cross_filesystem: false   # không đi sang phân vùng/ổ đĩa khác

whitelist:
  path: configs/whitelist.yaml
  autoload: true            # nạp YAML vào CSDL mỗi lần khởi động
  allow_expiry: true

# ---------------------------------------------------------------------------
# Người 2 — phân loại và cảnh báo
# ---------------------------------------------------------------------------
analysis:
  # Điểm tối thiểu để rơi vào từng mức. Nâng ngưỡng = ít cảnh báo hơn.
  threshold_low: 1
  threshold_medium: 30
  threshold_high: 60
  threshold_critical: 85
  suspicious_from: medium   # từ mức này trở lên thì không còn coi là hợp lệ

  burst_window: 60s         # cửa sổ đếm thay đổi hàng loạt
  burst_threshold: 25       # quá số này trong cửa sổ -> nghi ransomware
  entropy_sample: 262144    # số byte lấy mẫu để tính entropy
  entropy_threshold: 7.5    # >7.5 bit/byte: nhiều khả năng đã nén/mã hoá
  future_mtime_skew: 5m
  business_hours: [8, 18]   # ngoài khung này bị cộng điểm nhẹ

  known_good_hashes: []     # hash đã duyệt, khớp thì trừ mạnh điểm
  disabled_rules: []        # ví dụ: ["H024"] để tắt luật ngoài giờ
  rule_weights: {}          # ghi đè trọng số, ví dụ: {H024: 5}

alert:
  min_severity: medium      # thấp hơn thì chỉ lưu, không cảnh báo
  console: true
  jsonl_path: data/alerts.jsonl
  webhook_url: ""           # để trống là tắt
  webhook_timeout: 5.0

# ---------------------------------------------------------------------------
# Người 3 — dashboard
# ---------------------------------------------------------------------------
web:
  host: 127.0.0.1           # chỉ nghe nội bộ. Đổi sang 0.0.0.0 là tự chịu rủi ro
  port: 8000
  page_size: 50
  cors_origins: []
