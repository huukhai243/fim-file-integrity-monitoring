[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fim"
version = "0.1.0"
description = "Hệ thống giám sát toàn vẹn file (File Integrity Monitoring) và phát hiện thay đổi bất thường"
requires-python = ">=3.10"

[project.scripts]
fim = "fim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fim = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
